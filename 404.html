<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — 曹德偉</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Source+Serif+4:ital,wght@1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #08090a;
    --fg: #f7f8f8;
    --muted: #8a8f98;
    --accent: #5e6ad2;
    --accent-glow: rgba(94, 106, 210, 0.32);
    --border: #1f2126;
    --font-sans: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-serif: "Source Serif 4", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }
  header {
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1080px;
    margin: 0 auto;
    height: 56px;
    padding: 0 clamp(20px, 5vw, 40px);
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 14px;
  }
  .brand-dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-glow);
  }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px clamp(20px, 5vw, 40px);
  }
  .box {
    max-width: 480px;
    text-align: left;
  }
  .code {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
  }
  h1 {
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin: 0 0 20px;
  }
  h1 em {
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--accent);
    font-weight: 400;
  }
  p {
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.6;
    margin: 0 0 32px;
  }
  .links {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    height: 36px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 6px;
    border: 1px solid #2a2d33;
    background: #101113;
    color: var(--fg);
    transition: background 120ms ease, border-color 120ms ease;
  }
  .btn:hover { background: #16181c; border-color: #3a3d44; }
  .btn-primary {
    background: var(--accent);
    border-color: transparent;
    color: #fff;
  }
  .btn-primary:hover { background: #6c78dc; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="brand-dot"></span>
    <span>曹德偉</span>
  </div>
</header>

<main>
  <div class="box">
    <div class="code">404 · NOT FOUND</div>
    <h1>這頁<em>不存在</em>。</h1>
    <p>連結可能改了、或從來沒有過。回到首頁應該就好。</p>
    <div class="links">
      <a href="/" class="btn btn-primary">← 回首頁</a>
      <a href="https://github.com/zx22413" class="btn">GitHub ↗</a>
    </div>
  </div>
</main>
</body>
</html>
